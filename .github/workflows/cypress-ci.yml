name: "Run Cypress BDD Tests"

on:
  workflow_dispatch:  # Uruchamianie ręczne
  push:
    branches:
      - new_cypress_tests  # Uruchamiaj testy tylko na tej gałęzi

jobs:
  cypress-bdd-tests:
    runs-on: ubuntu-latest
    container:
      image: cypress/browsers:node-22.13.0-chrome-132.0.6834.83-1-ff-134.0.1-edge-131.0.2903.147-1
      options: --user 1001

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4  # Pobiera kod repozytorium

      - name: Set up Yarn
        run: yarn set version stable # Upewnia się, że Yarn jest dostępny

      - name: Cache Yarn dependencies
        uses: actions/cache@v3
        with:
          path: ~/.yarn
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install missing peer dependencies
        run: yarn add -D @babel/preset-env babel-loader esbuild

      - name: Install dependencies
        run: yarn install --immutable --immutable-cache

      - name: Run Cypress BDD Tests
        uses: cypress-io/github-action@v6
        with:
          start: ""  # Nie uruchamia serwera, aplikacja działa już pod adresem URL
          wait-on: "http://localhost:3000"  # Czeka na dostępność aplikacji
          wait-on-timeout: 90  # Wydłużony timeout do 90 sekund, aby uniknąć błędów
          browser: chrome
          record: false  # Nie wysyła wyników do Cypress Dashboard
          spec: "cypress/e2e/**/*.feature"  # Testy w formacie .feature (BDD)
          config-file: cypress.config.ts  # Plik konfiguracyjny Cypressa

        env:
          CYPRESS_PROJECT_ID: ${{ secrets.CYPRESS_PROJECT_ID }}  # ID projektu Cypress (opcjonalnie)
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}  # Klucz do raportowania testów (opcjonalnie)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Cypress screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots

      - name: Upload Cypress videos on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/videos
